name: Build & Deploy Static Site (Astro)

on:
  # Manual trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      puzzle_number:
        description: 'Puzzle number that triggered this build'
        required: false
        default: ''
      puzzle_date:
        description: 'Puzzle date (YYYY-MM-DD)'
        required: false
        default: ''

  # Auto-deploy on push to main (code changes)
  push:
    branches: [main]
    paths:
      - 'frontend-astro/**'
      - '.github/workflows/build.yml'

  # NOTE: The daily scheduled cron ('0 9 * * *') has been REMOVED.
  # Frontend builds are now triggered ONLY by the Cloudflare Worker's
  # workflow_dispatch (fired immediately after the 8:00 UTC scrape + D1 store),
  # plus manual workflow_dispatch and push-to-main. This ensures the site
  # updates right after the puzzle is captured (~1:30 PM IST) rather than
  # an hour later via a fallback schedule.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    defaults:
      run:
        working-directory: frontend-astro

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch data from Worker API
        run: node scripts/fetch-data.js
        env:
          API_BASE: ${{ secrets.WORKER_API_URL }}
          API_SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Build static site (Astro SSG)
        run: npx astro build

      - name: Verify build output
        run: |
          echo "Build output:"
          ls -la dist/
          echo ""
          echo "Data files:"
          ls -la dist/data/ 2>/dev/null || echo "No data directory"
          echo ""
          echo "Solutions files:"
          ls -la dist/data/solutions/ 2>/dev/null || echo "No solutions directory"
          echo ""
          echo "Build size:"
          du -sh dist/

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy dist --project-name=linkedin-pinpoint-answers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Google Indexing API
        if: ${{ success() }}
        continue-on-error: true
        run: |
          if [ -z "${GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON}" ]; then
            echo "GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON is not set. Skipping Google indexing notification."
            exit 0
          fi
          node scripts/notify-google-indexing.js
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: sc-domain:pinpointanswertoday.online
          GOOGLE_SITEMAP_URLS: |
            https://pinpointanswertoday.online/sitemap.xml
          GOOGLE_INDEXING_URLS: |
            https://pinpointanswertoday.online/
            https://pinpointanswertoday.online/today/

      - name: Submit URLs to Bing IndexNow
        if: ${{ success() }}
        continue-on-error: true
        run: node scripts/notify-indexnow.js
        env:
          INDEXNOW_KEY: e8bc65df06b546c8a729fef670f046ce
          INDEXNOW_ENDPOINT: https://www.bing.com/indexnow
          INDEXNOW_URLS: |
            https://pinpointanswertoday.online/
            https://pinpointanswertoday.online/today/

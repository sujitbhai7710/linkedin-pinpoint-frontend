name: Build & Deploy Static Site (Astro)

on:
  # Manual trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      puzzle_number:
        description: 'Puzzle number that triggered this build'
        required: false
        default: ''
      puzzle_date:
        description: 'Puzzle date (YYYY-MM-DD)'
        required: false
        default: ''

  # Auto-deploy on push to main (code changes)
  push:
    branches: [main]
    paths:
      - 'frontend-astro/**'
      - '.github/workflows/build.yml'

  # SAFETY NET: daily scheduled cron at 09:30 UTC (3:00 PM IST).
  # Primary trigger is the Cloudflare Worker's workflow_dispatch fired right
  # after the 8:00 UTC scrape, with retries at 8:30 and 9:00 UTC. This GitHub
  # schedule is the FINAL fallback in case all worker triggers fail (e.g.
  # revoked GITHUB_TOKEN, worker down). It runs 30 min after the worker's last
  # retry so they don't conflict; if the worker already deployed, this just
  # produces a redundant same-content deploy (harmless).
  schedule:
    - cron: '30 9 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    defaults:
      run:
        working-directory: frontend-astro

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch data from Worker API
        run: node scripts/fetch-data.js
        env:
          API_BASE: ${{ secrets.WORKER_API_URL }}
          API_SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Build static site (Astro SSG)
        run: npx astro build

      - name: Validate SEO build output
        run: npm run validate:seo

      - name: Verify build output
        run: |
          echo "Build output:"
          ls -la dist/
          echo ""
          echo "Data files:"
          ls -la dist/data/ 2>/dev/null || echo "No data directory"
          echo ""
          echo "Solutions files:"
          ls -la dist/data/solutions/ 2>/dev/null || echo "No solutions directory"
          echo ""
          echo "Build size:"
          du -sh dist/

      - name: Sanity-check today.json has today's puzzle (skip on push events)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          node -e "
          const fs = require('fs');
          const today = new Date();
          // Match worker's date math: UTC 'today' = midnight UTC slice
          const expectedDate = today.toISOString().split('T')[0];
          const data = JSON.parse(fs.readFileSync('dist/data/today.json', 'utf8'));
          console.log('Expected puzzle date:', expectedDate);
          console.log('today.json date:    ', data.date);
          console.log('today.json number:  ', data.number);
          console.log('today.json answer:  ', data.answer);
          if (!data.date || !data.number) {
            console.error('❌ FAIL: today.json is missing required fields');
            process.exit(1);
          }
          if (data.date !== expectedDate) {
            console.error('❌ FAIL: today.json date ' + data.date + ' does not match expected ' + expectedDate);
            console.error('    The worker scrape may have failed or stored stale data.');
            process.exit(1);
          }
          console.log('✅ today.json is fresh and matches expected date');
          "

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy dist --project-name=linkedin-pinpoint-answers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Submit sitemap to Google Search Console
        if: ${{ success() }}
        continue-on-error: true
        run: |
          if [ -z "${GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON}" ]; then
            echo "GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON is not set. Skipping Google indexing notification."
            exit 0
          fi
          node scripts/notify-google-indexing.js
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: sc-domain:pinpointanswertoday.online
          GOOGLE_SITEMAP_URLS: |
            https://pinpointanswertoday.online/sitemap.xml


      - name: Submit URLs to Bing IndexNow
        if: ${{ success() }}
        continue-on-error: true
        run: node scripts/notify-indexnow.js
        env:
          INDEXNOW_KEY: e8bc65df06b546c8a729fef670f046ce
          INDEXNOW_ENDPOINT: https://www.bing.com/indexnow
          INDEXNOW_URLS: |
            https://pinpointanswertoday.online/
            https://pinpointanswertoday.online/today/
          PUZZLE_DATE: ${{ inputs.puzzle_date }}
